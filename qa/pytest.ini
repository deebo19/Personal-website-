[pytest]
testpaths = tests
# Chromium, headless by default. Add --headed to watch, --browser firefox / webkit to switch.
addopts = --browser chromium --tracing retain-on-failure --screenshot only-on-failure --output test-results -ra
markers =
    smoke: fast checks that the site is up and the key content renders
    regression: the full functional suite
    mobile: runs on an emulated phone
