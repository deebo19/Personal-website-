name: Test & Deploy

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          CI: true
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        with:
          name: site-build
          path: build/
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  python-e2e:
    # Second, independent suite: Python + Playwright + Page Object Model, headless Chromium
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: site-build
          path: build
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: qa/requirements.txt
      - run: pip install -r qa/requirements.txt
      - run: python -m playwright install --with-deps chromium
      - name: Run POM suite (headless)
        working-directory: qa
        run: pytest
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: python-e2e-traces
          path: qa/test-results/
          retention-days: 14

  deploy:
    # Only ship to the live site from main, and only when both suites passed.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [test, python-e2e]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Deploy exactly the build that passed the tests
      - uses: actions/download-artifact@v4
        with:
          name: site-build
          path: _site
      - name: Check every local file the page references is in the bundle
        run: |
          missing=0
          for f in $(grep -oE '(src|href)="[^"#:]+"' _site/index.html | sed -E 's/^(src|href)="//; s/"$//; s/\?.*$//; s#^\./##'); do
            if [ ! -f "_site/$f" ]; then echo "::error::Missing from deploy bundle: $f"; missing=1; fi
          done
          exit $missing
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
